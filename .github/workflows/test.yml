name: Django CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "SECRET_KEY=dummy_secret_key_for_testing" >> .env
          echo "PAYPAL_CLIENT_ID=dummy_paypal_client_id" >> .env
          echo "PAYPAL_SECRET=dummy_paypal_secret" >> .env
          echo "PAYPAL_MODE=sandbox" >> .env

      - name: Ejecutar pruebas automatizadas
        run: |
          pytest
