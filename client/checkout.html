<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - LuxeConvert</title>
    <meta name="description" content="Completa tus datos de forma segura para confirmar tu cita y finalizar la compra.">

    <!-- Librerías Externas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

    <!-- Estilos "LuxeConvert" -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user-menu.css">
    <link rel="stylesheet" href="css/forms.css">
    <!-- Reutilizaremos estilos del carrito y añadiremos específicos de checkout -->
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/checkout.css">

</head>
<body>

    <div id="preloader"><div class="spinner"></div></div>
    <div id="nav-placeholder"></div>

    <main>
        <section class="section checkout-section">
            <div class="container" data-aos="fade-up">

                <!-- ENCABEZADO: VUELTA AL CARRITO -->
                <div class="checkout-header">
                    <h1 class="cart-header__title">Finalizar Compra</h1>
                    <a href="cart.html" class="cart-header__continue-shopping">&larr; Volver al carrito</a>
                </div>

                <!-- LAYOUT DE DOS COLUMNAS (heredado de cart.css) -->
                <div class="cart-layout">

                    <!-- COLUMNA IZQUIERDA: FORMULARIOS -->
                    <div class="checkout-form-panel">
                        <form id="checkout-form">
                            
                            <!-- SECCIÓN 1: INFORMACIÓN DE CONTACTO -->
                            <fieldset class="form-fieldset">
                                <legend class="fieldset-legend">
                                    <span class="legend-number">1</span>
                                    Información de Contacto
                                </legend>
                                <div class="form-group">
                                    <label for="name" class="form-label">Nombre completo</label>
                                    <input type="text" id="name" name="name" class="form-input" placeholder="Tu nombre y apellidos" required>
                                </div>
                                <div class="form-group">
                                    <label for="email" class="form-label">Correo electrónico</label>
                                    <input type="email" id="email" name="email" class="form-input" placeholder="donde enviaremos tu confirmación" required>
                                </div>
                            </fieldset>

                            <!-- SECCIÓN 2: DETALLES DE PAGO -->
                            <fieldset class="form-fieldset">
                                <legend class="fieldset-legend">
                                    <span class="legend-number">2</span>
                                    Detalles de Pago
                                </legend>
                                <div class="form-group">
                                    <label for="card-number" class="form-label">Número de Tarjeta</label>
                                    <input type="text" id="card-number" class="form-input" placeholder="•••• •••• •••• ••••" required>
                                </div>
                                <div class="form-row">
                                    <div class="form-group form-group--half">
                                        <label for="expiry-date" class="form-label">Fecha de Expiración</label>
                                        <input type="text" id="expiry-date" class="form-input" placeholder="MM / AA" required>
                                    </div>
                                    <div class="form-group form-group--half">
                                        <label for="cvc" class="form-label">CVC</label>
                                        <input type="text" id="cvc" class="form-input" placeholder="•••" required>
                                    </div>
                                </div>
                            </fieldset>

                        </form>
                    </div>

                    <!-- COLUMNA DERECHA: RESUMEN DE PEDIDO (pegajosa) -->
                    <aside class="cart-summary">
                        <div id="checkout-summary" class="cart-summary__card">
                            <h2 class="cart-summary__title">Resumen de tu Compra</h2>
                            
                            <!-- Items se inyectarán aquí por JS -->
                            <div id="summary-items-container" class="summary-items">
                                <!-- Ejemplo: 
                                <div class="summary-item">
                                    <span class="summary-item__title">Microblading de Cejas</span>
                                    <span class="summary-item__price">€150.00</span>
                                </div>
                                -->
                            </div>

                            <div class="cart-summary__separator"></div>

                            <div class="cart-summary__line">
                                <span>Subtotal</span>
                                <span id="summary-subtotal">€0.00</span>
                            </div>
                            
                            <div class="cart-summary__line">
                                <span>Descuento</span>
                                <span id="summary-discount">-€0.00</span>
                            </div>

                            <div class="cart-summary__separator"></div>

                            <div class="cart-summary__line cart-summary__line--total">
                                <span>Total a Pagar</span>
                                <span id="summary-total">€0.00</span>
                            </div>

                            <div class="cart-summary__actions">
                                <div id="form-status" class="form-status form-status--error" style="display:none; margin-bottom: 1rem;"></div>
                                <button type="submit" form="checkout-form" class="btn btn-primary btn--full-width" id="checkout-button">Confirmar y Pagar</button>
                            </div>

                            <!-- SEÑALES DE CONFIANZA FINALES -->
                            <div class="checkout-trust-signals">
                                <div class="trust-signal">
                                    <i class="fas fa-lock"></i>
                                    <span>Transacción segura SSL</span>
                                </div>
                                <div class="accepted-payments">
                                    <i class="fab fa-cc-visa"></i>
                                    <i class="fab fa-cc-mastercard"></i>
                                    <i class="fab fa-cc-amex"></i>
                                </div>
                            </div>
                        </div>
                    </aside>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="js/app.js" type="module"></script> 
    <script src="js/checkout.js" type="module"></script>
</body>
</html>
