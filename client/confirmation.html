<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación de Pedido - LuxeConvert</title>
    <meta name="robots" content="noindex, nofollow"> <!-- Evitar que buscadores la indexen -->

    <!-- Librerías Externas -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Estilos "LuxeConvert" -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user-menu.css">
    <link rel="stylesheet" href="css/confirmation.css">
</head>
<body>
    <div id="preloader"><div class="spinner"></div></div>
    <div id="nav-placeholder"></div>

    <main>
        <section class="section confirmation-section">
            <div class="container">
                <div class="confirmation-card">
                    <div class="confirmation-icon">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <h1 class="confirmation-title">¡Gracias por tu confianza!</h1>
                    <p class="confirmation-text">
                        Hemos recibido tu pedido correctamente. Recibirás un correo electrónico de confirmación en breve con todos los detalles.
                    </p>
                    <div class="confirmation-order-id">
                        Tu número de referencia es: <strong id="order-id">Cargando...</strong>
                    </div>
                    <div class="confirmation-actions">
                        <a href="/portfolio.html" class="btn btn-secondary">Explorar más servicios</a>
                        <a href="/" class="btn btn-primary">Volver al Inicio</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="js/app.js" type="module" defer></script>
    <script src="js/confirmation.js" defer></script>
</body>
</html>
